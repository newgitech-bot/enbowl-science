name: Publish to Instagram

# 화·금 19:00 (KST) 에 publish_date 가 된 미게시 콘텐츠를 게시
# PR 머지만으로는 게시되지 않음. 바로 올리려면 Run workflow 에 폴더를 입력.
on:
  schedule:
    - cron: "0 10 * * 2,5"
  workflow_dispatch:
    inputs:
      post:
        description: "지금 바로 게시할 폴더 (예: posts/2026-11-24-EP04). 비우면 날짜가 된 것만"
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_REF: ${{ github.sha }}
        run: |
          if [ -n "${{ github.event.inputs.post }}" ]; then
            python scripts/publish.py "${{ github.event.inputs.post }}"
          else
            python scripts/publish.py --due
          fi

      - name: Record published state
        if: always()
        run: |
          git config user.name "enbowl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "게시 기록 [skip ci]"
            git push
          fi
