name: Fetch AI assets

# assets/ai/urls.txt 의 "이름 URL" 목록을 내려받아 같은 브랜치에 커밋
on:
  push:
    branches-ignore: [main]
    paths: ["assets/ai/urls.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL -o "assets/ai/$name.png" "$url" && echo "$name ok"
          done < assets/ai/urls.txt
          git config user.name "enbowl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/ai/*.png
          git diff --cached --quiet || (git commit -m "AI 일러스트 내려받기 [skip ci]" && git push)
