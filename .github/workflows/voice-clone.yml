name: Voice clone (CosyVoice 2)

# narration.json 의 voice 가 "clone" 인 게시물 중 narration_clone/ 이 아직 없는 것을
# 준서님 목소리로 읽어 같은 브랜치에 커밋한다.
# 참고 음성은 voice/ref.flac.gpg (암호화) 를 Secrets 의 VOICE_KEY 로 풀어서 쓴다.
# 다시 만들고 싶으면 그 게시물의 narration_clone/ 폴더를 지우고 push.
on:
  push:
    branches-ignore: [main]
    paths: ["posts/**/narration.json", "scripts/tts_clone.py", ".github/workflows/voice-clone.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Find targets
        id: t
        env:
          K: ${{ secrets.VOICE_KEY }}
        run: |
          if [ -z "$K" ]; then echo "VOICE_KEY 없음, 건너뜀"; exit 0; fi
          T=""
          for f in posts/*/narration.json; do
            d=$(dirname "$f")
            python -c "import json,sys; sys.exit(0 if json.load(open('$f')).get('voice')=='clone' else 1)" || continue
            [ -f "$d/narration_clone/durations.json" ] && continue
            T="$T $d"
          done
          echo "대상:$T"
          echo "targets=$T" >> $GITHUB_OUTPUT
      - name: Install CosyVoice
        if: steps.t.outputs.targets != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-dev ffmpeg
          git clone --recursive --depth 1 https://github.com/FunAudioLLM/CosyVoice.git
          cd CosyVoice
          pip install -q "setuptools<70" wheel
          W=$(grep -i "^openai-whisper" requirements.txt || echo openai-whisper==20231117)
          pip install -q --no-build-isolation "$W"
          grep -viE "tensorrt|deepspeed|onnxruntime-gpu|^--extra-index|^openai-whisper" requirements.txt > req.txt
          pip install -q -r req.txt onnxruntime faster-whisper
          python -c "from huggingface_hub import snapshot_download; snapshot_download('FunAudioLLM/CosyVoice2-0.5B', local_dir='pretrained_models/CosyVoice2-0.5B')"
      - name: Generate
        if: steps.t.outputs.targets != ''
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          cd CosyVoice
          for d in ${{ steps.t.outputs.targets }}; do
            python ../scripts/tts_clone.py "../$d" narration_clone
          done
      - name: Commit
        if: steps.t.outputs.targets != ''
        run: |
          git config user.name "enbowl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*/narration_clone/
          git diff --cached --quiet || (git commit -m "목소리 복제 나레이션 [skip ci]" && git pull --rebase -q && git push)
