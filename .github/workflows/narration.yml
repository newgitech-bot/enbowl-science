name: Narration (MeloTTS)

# narration.json 이 바뀌면 한국어 나레이션 음성을 만들어 같은 브랜치에 커밋
on:
  push:
    branches-ignore: [main]
    paths: ["posts/**/narration.json", "scripts/tts.py", ".github/workflows/narration.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: melotts-v1
      - name: Install MeloTTS
        run: |
          pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - name: Generate narration
        run: |
          for f in $(git diff --name-only HEAD~1 HEAD -- 'posts/**/narration.json' 2>/dev/null; ls posts/*/narration.json); do
            d=$(dirname "$f")
            [ -f "$d/narration/durations.json" ] && [ "$d/narration/durations.json" -nt "$f" ] && continue
            echo "== $d"; python scripts/tts.py "$d"
          done
      - name: Commit audio
        run: |
          git config user.name "enbowl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*/narration/
          if ! git diff --cached --quiet; then
            git commit -m "나레이션 생성 [skip ci]"
            git push
          fi
